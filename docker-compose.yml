services:
  marcheplus:
    build: .
    # Lié à la boucle locale par défaut : sur le VPS, seul le nginx de l'hôte doit
    # atteindre l'application. Sans cela, http://IP:port contournerait le proxy et
    # son certificat. HTTP_PORT/HTTP_BIND viennent du .env (voir deploiement/).
    ports: ["${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-3000}:3000"]
    environment:
      JWT_SECRET: ${JWT_SECRET:?définir JWT_SECRET (ex. openssl rand -hex 32)}
      JWT_TTL: ${JWT_TTL:-8h}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      SHOW_DEMO_ACCOUNTS: ${SHOW_DEMO_ACCOUNTS:-0}
      SEED_DEMO: ${SEED_DEMO:-1}
      ALLOW_RESET: ${ALLOW_RESET:-1}
      MAX_FILE_MB: ${MAX_FILE_MB:-10}
    volumes: ["marcheplus-data:/data"]
    restart: unless-stopped
volumes:
  marcheplus-data:
