services:
  marcheplus:
    build: .
    # Lié à la boucle locale par défaut : sur le VPS, seul le nginx de l'hôte doit
    # atteindre l'application. Sans cela, http://IP:port contournerait le proxy et
    # son certificat. HTTP_PORT/HTTP_BIND viennent du .env (voir deploiement/).
    ports: ["${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-3000}:3000"]
    environment:
      JWT_SECRET: ${JWT_SECRET:?définir JWT_SECRET (ex. openssl rand -hex 32)}
      JWT_TTL: ${JWT_TTL:-8h}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      SHOW_DEMO_ACCOUNTS: ${SHOW_DEMO_ACCOUNTS:-0}
      SEED_DEMO: ${SEED_DEMO:-1}
      # Instance réelle (SEED_DEMO=0) : compte administrateur initial et nom de l'organisation
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NOM: ${ADMIN_NOM:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ORG_NOM: ${ORG_NOM:-}
      ORG_VILLE: ${ORG_VILLE:-}
      ORG_PAYS: ${ORG_PAYS:-}
      ALLOW_RESET: ${ALLOW_RESET:-1}
      MAX_FILE_MB: ${MAX_FILE_MB:-10}
      # Courriels par Microsoft 365 (voir README, « Courriels ») ; sans MAIL_MODE=graph, ils restent simulés
      APP_URL: ${APP_URL:-}
      # Plateforme multi-entreprises (voir deploiement/DEPLOIEMENT.md) : vide = un seul client, comme avant
      PLATEFORME_DOMAINE: ${PLATEFORME_DOMAINE:-}
      ESPACE_INITIAL: ${ESPACE_INITIAL:-demo}
      # Ouverture des espaces : accord d'un opérateur dans la console (défaut) ou « auto » dès la confirmation du courriel
      PLATEFORME_VALIDATION: ${PLATEFORME_VALIDATION:-}
      # Premier opérateur de la console (https://<domaine>/console), créé au démarrage s'il n'en existe aucun
      CONSOLE_EMAIL: ${CONSOLE_EMAIL:-}
      CONSOLE_NOM: ${CONSOLE_NOM:-}
      CONSOLE_MOT_DE_PASSE: ${CONSOLE_MOT_DE_PASSE:-}
      MAIL_MODE: ${MAIL_MODE:-simule}
      M365_TENANT_ID: ${M365_TENANT_ID:-}
      M365_CLIENT_ID: ${M365_CLIENT_ID:-}
      M365_CLIENT_SECRET: ${M365_CLIENT_SECRET:-}
      M365_SENDER: ${M365_SENDER:-}
    volumes: ["marcheplus-data:/data"]
    restart: unless-stopped
volumes:
  marcheplus-data:
