# ═══════════════════════════════════════════════════════════════════════════════
# VHOST À POSER SUR LE NGINX DE L'HÔTE — /etc/nginx/sites-available/marcheplus
#
# Même schéma que hr360 : le conteneur se lie à 127.0.0.1:3610, le nginx de l'hôte
# est le seul point d'entrée. Le bloc 443 n'est pas écrit à la main :
# `certbot --nginx -d <sous-domaine>` l'ajoute lui-même avec la redirection.
# ═══════════════════════════════════════════════════════════════════════════════

upstream marcheplus {
    server 127.0.0.1:3610;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    # À RENSEIGNER : le sous-domaine réel, qui doit pointer sur ce VPS.
    server_name tenders.neuronestech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://marcheplus;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pièces jointes des offres : 10 Mo par défaut (MAX_FILE_MB), avec marge.
        # Un refus nginx en 413 est illisible ; le refus applicatif nomme la limite.
        client_max_body_size 15m;
    }
}
