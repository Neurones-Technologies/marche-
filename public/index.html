<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marché+</title>
<script src="/js/theme.js"></script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/login.css">
</head>
<body>
<a class="skip" href="#main">Aller au contenu principal</a>
<div id="backdrop"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="shell">
<aside class="side" id="side" aria-label="Navigation principale">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 120 120" aria-hidden="true" focusable="false"><path class="logo-forme" d="M44 16 H100 A10 10 0 0 1 110 26 V94 A10 10 0 0 1 100 104 H44 L10 60 Z"/><circle class="logo-trou" cx="38" cy="60" r="7"/><path class="logo-trait" d="M56 60 L70 75 L96 45"/></svg><span class="logo-mot">Marché<span class="logo-plus">+</span></span>
  </div>
  <div class="navs" id="navs"></div>
  <div class="side-foot">
    <div class="tenant" id="tenant"></div>
    <button class="btn btn-ghost btn-sm" id="btn-reset-all">Réinitialiser</button>
  </div>
</aside>
<div class="wrap">
  <div class="topbar">
    <button class="btn btn-ghost btn-sm burger" id="burger" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="side">Menu</button>
    <div class="topbar-titre" id="top-titre"></div>
    <div>
      <span class="chip" id="phase-chip">Phase</span>
      <span class="usr" id="usr" hidden>
        <button class="cloche" id="cloche" type="button" aria-label="Notifications" title="Notifications"></button>
        <button class="acct" id="acct" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="acct-menu"><span class="usr-name" id="usr-name"></span><span class="avatar" id="usr-av" aria-hidden="true"></span></button>
        <div class="acct-menu" id="acct-menu" hidden>
          <label for="palette">Palette</label>
          <select id="palette">
            <option value="chaleureux">Chaleureux</option>
            <option value="institutionnel">Institutionnel</option>
            <option value="vivant">Vivant</option>
          </select>
          <button class="btn btn-ghost btn-sm" id="btn-pwd" type="button">Mot de passe</button>
          <button class="btn btn-ghost btn-sm" id="btn-suppleances" type="button" hidden>Mes suppléances</button>
          <button class="btn btn-ghost btn-sm" id="btn-logout" type="button">Déconnexion</button>
        </div>
      </span>
    </div>
  </div>
  <main id="main" tabindex="-1"></main>
</div>
</div>


<div id="login" class="login" role="dialog" aria-modal="true" aria-labelledby="login-t">
  <form id="login-form" class="login-card" novalidate>
    <div class="login-brand"><svg class="login-mark" viewBox="0 0 120 120" aria-hidden="true" focusable="false"><path class="logo-forme" d="M44 16 H100 A10 10 0 0 1 110 26 V94 A10 10 0 0 1 100 104 H44 L10 60 Z"/><circle class="logo-trou" cx="38" cy="60" r="7"/><path class="logo-trait" d="M56 60 L70 75 L96 45"/></svg><span class="logo-mot">Marché<span class="logo-plus">+</span></span></div>
    <div class="login-espace" id="lg-espace" hidden></div>
    <h1 id="login-t">Connexion</h1>
    <label for="lg-email">Courriel</label>
    <input id="lg-email" type="email" autocomplete="username" required>
    <label for="lg-pw">Mot de passe</label>
    <input id="lg-pw" type="password" autocomplete="current-password" required>
    <div id="lg-err" class="lg-err" role="alert" hidden></div>
    <button class="btn btn-primary" type="submit" id="lg-go">Connecter</button>
    <button type="button" class="lg-lien" id="lg-oubli">Mot de passe oublié ?</button>
    <div id="lg-ok" class="lg-ok" role="status" hidden></div>
    <details class="lg-demo" id="lg-demo" hidden>
      <summary>Comptes de démo</summary>
      <div id="lg-demo-list"></div>
    </details>
  </form>
  <form id="oubli-form" class="login-card" novalidate hidden>
    <h1>Mot de passe oublié</h1>
    <p class="muted">Indiquez le courriel de votre compte : vous recevrez un lien pour choisir un nouveau mot de passe.</p>
    <label for="ob-email">Courriel</label>
    <input id="ob-email" type="email" autocomplete="username" required>
    <div id="ob-err" class="lg-err" role="alert" hidden></div>
    <div id="ob-ok" class="lg-ok" role="status" hidden></div>
    <button class="btn btn-primary" type="submit" id="ob-go">Envoyer le lien</button>
    <button type="button" class="lg-lien" id="ob-retour">Retour à la connexion</button>
  </form>
  <form id="reinit-form" class="login-card" novalidate hidden>
    <h1>Nouveau mot de passe</h1>
    <label for="ri-pw1">Nouveau mot de passe</label>
    <input id="ri-pw1" type="password" autocomplete="new-password" required>
    <label for="ri-pw2">Confirmation</label>
    <input id="ri-pw2" type="password" autocomplete="new-password" required>
    <small class="muted">10 caractères minimum, avec majuscule, minuscule et chiffre.</small>
    <div id="ri-err" class="lg-err" role="alert" hidden></div>
    <button class="btn btn-primary" type="submit" id="ri-go">Enregistrer</button>
  </form>
</div>
<div id="dlg" class="dlg" hidden></div>

<script src="/js/app/ecrans/proces-verbal.js"></script>

</body>
</html>
