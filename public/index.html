<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marché+</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/login.css">
</head>
<body>
<a class="skip" href="#main">Aller au contenu principal</a>
<div id="backdrop"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="shell">
<aside class="side" id="side" aria-label="Navigation principale">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">M+</span>Marché+
  </div>
  <div class="side-proc" id="side-proc"></div>
  <div class="navs" id="navs"></div>
  <div class="side-foot">
    <div class="tenant" id="tenant"></div>
    <button class="btn btn-ghost btn-sm" id="btn-reset-all">Réinitialiser</button>
  </div>
</aside>
<div class="wrap">
  <div class="topbar">
    <button class="btn btn-ghost btn-sm burger" id="burger" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="side">Menu</button>
    <div></div>
    <div>
      <span class="chip" id="phase-chip">Phase</span>
      <span class="usr" id="usr" hidden>
        <button class="acct" id="acct" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="acct-menu"><span class="usr-name" id="usr-name"></span><span class="avatar" id="usr-av" aria-hidden="true"></span></button>
        <div class="acct-menu" id="acct-menu" hidden>
          <label for="palette">Palette</label>
          <select id="palette">
            <option value="chaleureux">Chaleureux</option>
            <option value="institutionnel">Institutionnel</option>
            <option value="vivant">Vivant</option>
          </select>
          <button class="btn btn-ghost btn-sm" id="btn-pwd" type="button">Mot de passe</button>
          <button class="btn btn-ghost btn-sm" id="btn-logout" type="button">Déconnexion</button>
        </div>
      </span>
    </div>
  </div>
  <main id="main" tabindex="-1"></main>
</div>
</div>


<div id="login" class="login" role="dialog" aria-modal="true" aria-labelledby="login-t">
  <form id="login-form" class="login-card" novalidate>
    <div class="login-brand">Marché+</div>
    <h1 id="login-t">Connexion</h1>
    <label for="lg-email">Courriel</label>
    <input id="lg-email" type="email" autocomplete="username" required>
    <label for="lg-pw">Mot de passe</label>
    <input id="lg-pw" type="password" autocomplete="current-password" required>
    <div id="lg-err" class="lg-err" role="alert" hidden></div>
    <button class="btn btn-primary" type="submit" id="lg-go">Connecter</button>
    <div id="lg-ok" class="lg-ok" role="status" hidden></div>
    <button class="lg-switch" type="button" id="lg-to-signup">Prestataire : inscrire mon entreprise</button>
    <details class="lg-demo" id="lg-demo" hidden>
      <summary>Comptes de démo</summary>
      <div id="lg-demo-list"></div>
    </details>
  </form>
  <!-- Inscription d'un prestataire : seule page utilisable sans compte. Le compte reste inactif jusqu'à la
       vérification du courriel. Le champ « site » est un piège à robots, invisible pour une personne. -->
  <form id="signup-form" class="login-card" novalidate hidden>
    <div class="login-brand">Marché+</div>
    <h1 id="signup-t">Inscrire mon entreprise</h1>
    <p class="lg-note">Créez le compte de votre entreprise pour constituer votre dossier de référencement et répondre aux appels d’offres.</p>
    <label for="su-rs">Raison sociale</label>
    <input id="su-rs" type="text" autocomplete="organization" maxlength="200" required>
    <label for="su-pays">Pays d’établissement</label>
    <select id="su-pays" required>
      <option value="CI">Côte d’Ivoire</option>
      <option value="BF">Burkina Faso</option>
      <option value="BJ">Bénin</option>
      <option value="GW">Guinée-Bissau</option>
      <option value="ML">Mali</option>
      <option value="NE">Niger</option>
      <option value="SN">Sénégal</option>
      <option value="TG">Togo</option>
      <option value="CM">Cameroun</option>
      <option value="GH">Ghana</option>
      <option value="GN">Guinée</option>
      <option value="MA">Maroc</option>
      <option value="NG">Nigeria</option>
      <option value="DE">Allemagne</option>
      <option value="BE">Belgique</option>
      <option value="CN">Chine</option>
      <option value="FR">France</option>
      <option value="US">États-Unis</option>
    </select>
    <label for="su-immat">Numéro d’immatriculation (RCCM ou équivalent)</label>
    <input id="su-immat" type="text" maxlength="80">
    <label for="su-nom">Nom du contact</label>
    <input id="su-nom" type="text" autocomplete="name" maxlength="120" required>
    <label for="su-email">Courriel professionnel</label>
    <input id="su-email" type="email" autocomplete="email" required>
    <label for="su-pw">Mot de passe</label>
    <input id="su-pw" type="password" autocomplete="new-password" required>
    <small class="lg-note">10 caractères minimum, avec majuscule, minuscule et chiffre.</small>
    <div class="lg-hp" aria-hidden="true"><label for="su-site">Site web</label><input id="su-site" type="text" tabindex="-1" autocomplete="off"></div>
    <div id="su-err" class="lg-err" role="alert" hidden></div>
    <div id="su-ok" class="lg-ok" role="status" hidden></div>
    <button class="btn btn-primary" type="submit" id="su-go">Créer le compte</button>
    <button class="lg-switch" type="button" id="su-to-login">J’ai déjà un compte : me connecter</button>
  </form>
</div>
<div id="dlg" class="dlg" hidden></div>

<script src="/js/profils.js"></script>
<script src="/js/circuits.js"></script>
<script src="/js/regles.js"></script>
<script src="/js/api.js"></script>
<!-- Interface : scripts classiques partagés, dans cet ordre (voir js/app/LISEZMOI.md) -->
<script src="/js/app/noyau.js"></script>
<script src="/js/app/composants.js"></script>
<script src="/js/app/ecrans/dao.js"></script>
<script src="/js/app/ecrans/tableau-de-bord.js"></script>
<script src="/js/app/ecrans/cahier-des-charges.js"></script>
<script src="/js/app/ecrans/criteres.js"></script>
<script src="/js/app/ecrans/reception.js"></script>
<script src="/js/app/ecrans/depouillement.js"></script>
<script src="/js/app/ecrans/conformite.js"></script>
<script src="/js/app/ecrans/evaluation.js"></script>
<script src="/js/app/ecrans/decision.js"></script>
<script src="/js/app/ecrans/proces-verbal.js"></script>
<script src="/js/app/ecrans/audit.js"></script>
<script src="/js/app/ecrans/portail.js"></script>
<script src="/js/app/ecrans/notifications.js"></script>
<script src="/js/app/ecrans/comptes-roles.js"></script>
<script src="/js/app/ecrans/procedures.js"></script>
<script src="/js/app/ecrans/besoins.js"></script>
<script src="/js/app/ecrans/partenaires.js"></script>
<script src="/js/app/ecrans/parametres.js"></script>
<script src="/js/app/ecrans/alertes.js"></script>
<script src="/js/app/ecrans/questions.js"></script>
<script src="/js/app/ecrans/clarifications.js"></script>
<script src="/js/app/ecrans/recours.js"></script>
<script src="/js/app/demarrage.js"></script>
</body>
</html>
