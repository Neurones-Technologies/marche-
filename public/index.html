<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marché+</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/login.css">
</head>
<body>
<a class="skip" href="#main">Aller au contenu principal</a>
<div id="backdrop"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="shell">
<aside class="side" id="side" aria-label="Navigation principale">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">M+</span>Marché+
  </div>
  <div class="side-proc" id="side-proc"></div>
  <div class="navs" id="navs"></div>
  <div class="side-foot">
    <div class="tenant" id="tenant"></div>
    <button class="btn btn-ghost btn-sm" id="btn-reset-all">Réinitialiser</button>
  </div>
</aside>
<div class="wrap">
  <div class="topbar">
    <button class="btn btn-ghost btn-sm burger" id="burger" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="side">Menu</button>
    <div></div>
    <div>
      <span class="chip" id="phase-chip">Phase</span>
      <span class="usr" id="usr" hidden>
        <button class="acct" id="acct" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="acct-menu"><span class="usr-name" id="usr-name"></span><span class="avatar" id="usr-av" aria-hidden="true"></span></button>
        <div class="acct-menu" id="acct-menu" hidden>
          <label for="palette">Palette</label>
          <select id="palette">
            <option value="chaleureux">Chaleureux</option>
            <option value="institutionnel">Institutionnel</option>
            <option value="vivant">Vivant</option>
          </select>
          <button class="btn btn-ghost btn-sm" id="btn-pwd" type="button">Mot de passe</button>
          <button class="btn btn-ghost btn-sm" id="btn-logout" type="button">Déconnexion</button>
        </div>
      </span>
    </div>
  </div>
  <main id="main" tabindex="-1"></main>
</div>
</div>


<div id="login" class="login" role="dialog" aria-modal="true" aria-labelledby="login-t">
  <form id="login-form" class="login-card" novalidate>
    <div class="login-brand">Marché+</div>
    <h1 id="login-t">Connexion</h1>
    <label for="lg-email">Courriel</label>
    <input id="lg-email" type="email" autocomplete="username" required>
    <label for="lg-pw">Mot de passe</label>
    <input id="lg-pw" type="password" autocomplete="current-password" required>
    <div id="lg-err" class="lg-err" role="alert" hidden></div>
    <button class="btn btn-primary" type="submit" id="lg-go">Connecter</button>
    <details class="lg-demo" id="lg-demo" hidden>
      <summary>Comptes de démo</summary>
      <div id="lg-demo-list"></div>
    </details>
  </form>
</div>
<div id="dlg" class="dlg" hidden></div>

<script src="/js/profils.js"></script>
<script src="/js/regles.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
